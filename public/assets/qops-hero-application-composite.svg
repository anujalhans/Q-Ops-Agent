      .whiteLabel { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 26px; font-weight: 850; fill: #FFFFFF; }
      .whiteSmall { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 650; fill: #DAD7FF; }
      .metric { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 44px; font-weight: 900; fill: #1B1B24; }
      .mono { font-family: Consolas, Menlo, monospace; font-size: 19px; font-weight: 700; fill: #4F46E5; }
