<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Q-Ops Agent application composite</title>
  <desc id="desc">A single enterprise hero image showing Q-Ops Agent features including project evidence ingestion, knowledge base, document generation, Jira and Confluence outputs, analytics, audit trail, and governed operations.</desc>
  <defs>
